<!doctype html>
<html lang="ko">
<head>

<title>WOD 입력 팝업</title>

<style>
body{margin:0}
h1,h2,h3{font-family:'Montserrat','Pretendard','Noto Sans KR',sans-serif;font-weight:700}

</head>
<body>
<div style="width: 390px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F3F5; color: #18181B; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 10px; padding: 24px 16px 12px">
<a href="Meeting.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #18181B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 18px">역할 예약하기</h1><span style="font-size: 12px; color: #52525B">KUTM #820 · 11/19(목) 오후 7:30</span></div>
</header><main style="flex: 1"></main><div style="position: absolute; inset: 0; background: rgba(24,24,27,0.45)"></div>
<div role="dialog" aria-label="오늘의 단어" style="position: absolute; left: 16px; right: 16px; top: 120px; display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(24,24,27,0.08)">
<div style="display: flex; align-items: center; justify-content: space-between"><h2 style="margin: 0; font-size: 19px">오늘의 단어</h2><a href="Reserve.html" aria-label="닫기" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 20px; background: #F2F3F5; color: #18181B; text-decoration: none; font-size: 18px">×</a></div>
<span style="font-size: 13px; color: #52525B">KUTM #820 · 어법지기</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">단어<input type="text" placeholder="예: Aspire" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">뜻<input type="text" placeholder="예: to long, aim or seek ambitiously" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">예문 (선택)<input type="text" placeholder="예문을 적으면 아젠다에 함께 표시돼요" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #004165; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; text-decoration: none; min-height: 50px; font-size: 15px">저장하기</button>

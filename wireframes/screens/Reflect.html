<body>
<div style="width: 390px; height: 1500px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F3F5; color: #18181B; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif">
<header style="display: flex; align-items: center; gap: 10px; padding: 24px 16px 12px">
<a href="MeetingPopup.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #18181B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 18px">오늘의 나</h1><span style="font-size: 12px; color: #52525B">KUTM #820 · 11월 19일 · 어법지기</span></div>
</header><div style="display: flex; flex-direction: column; gap: 6px; margin: 0 12px 12px; padding: 16px 18px; border-radius: 20px; background: #E5EDF2"><b style="font-size: 15px; color: #004165">잘했다·못했다가 아니라, 어땠는지만 남겨요.</b><span style="font-size: 13px; color: #18181B">누르기만 하면 돼요. 쌓인 기록은 결산에서 흐름으로 보여드려요.</span></div><main style="flex: 1; display: flex; flex-direction: column"><section style="display: flex; flex-direction: column; gap: 12px; margin: 0 12px; border-radius: 24px; background: #FFFFFF; padding: 20px 20px"><div style="display: flex; flex-direction: column"><div style="padding: 12px 0;"><div role="radiogroup" aria-label="준비한 시간" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">1. 준비한 시간</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">안 함</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">10분 이내</button><button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">30분 이내</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">1시간 이상</button></div></div></div><div style="padding: 12px 0; border-top: 1px solid #E6E9EB;"><div role="radiogroup" aria-label="시작할 때 긴장감" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">2. 시작할 때 긴장감</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">편안했음</button><button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">조금 긴장</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">많이 긴장</button></div></div></div><div style="padding: 12px 0; border-top: 1px solid #E6E9EB;"><div role="radiogroup" aria-label="시간 안에 마쳤나요" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">3. 시간 안에 마쳤나요</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">시간 안에</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">조금 넘김</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">많이 넘김</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">해당 없음</button></div></div></div><div style="padding: 12px 0; border-top: 1px solid #E6E9EB;"><div role="radiogroup" aria-label="말 속도" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">4. 말 속도</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">느린 편</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">적당</button><button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">빠른 편</button></div></div></div><div style="padding: 12px 0; border-top: 1px solid #E6E9EB;"><div role="radiogroup" aria-label="청중과 눈맞춤" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">5. 청중과 눈맞춤</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">거의 못함</button><button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">가끔</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">자주</button></div></div></div><div style="padding: 12px 0; border-top: 1px solid #E6E9EB;"><div role="radiogroup" aria-label="원하는 표현이 떠올랐나요" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">6. 원하는 표현이 떠올랐나요</span><span style="font-size: 12px; color: #52525B">영어·한국어 등 모임 언어 기준</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">잘 떠올랐음</button><button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">가끔 막힘</button><button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">자주 막힘</button></div></div></div><div style="padding: 12px 0; border-top: 1px solid #E6E9EB;"><div role="group" aria-label="오늘 새로 시도한 것" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">7. 오늘 새로 시도한 것 <span style="font-size: 12px; font-weight: 400; color: #52525B">· 여러 개 선택</span></span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">제스처</button><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">유머</button><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">청중에게 질문</button><button type="button" role="checkbox" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">새 표현</button><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">메모 없이 말하기</button><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">없음</button></div></div></div><div style="padding: 12px 0; border-top: 1px solid #E6E9EB;"><div role="group" aria-label="다음에 해보고 싶은 것" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700">8. 다음에 해보고 싶은 것 <span style="font-size: 12px; font-weight: 400; color: #52525B">· 여러 개 선택</span></span><div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">같은 역할 다시</button><button type="button" role="checkbox" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165">다른 역할</button><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">연설</button><button type="button" role="checkbox" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B">평가</button></div></div></div></div><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">한 줄 메모 (선택)<input type="text" placeholder="예: 오늘 오늘의 단어를 4번 들었다" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label></section></main><footer style="background: #FFFFFF; display: flex; flex-direction: column; gap: 6px; padding: 12px 20px 24px; border-top: 1px solid #E6E9EB"><button type="button" style="display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #004165; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; text-decoration: none; min-height: 52px; font-size: 16px">기록 남기기</button><span style="font-size: 11px; text-align: center; color: #52525B">항목 초안 · 함께 다듬을 예정</span></footer>
</div>

<div style="width: 390px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F3F5; color: #18181B; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; position: relative; overflow: hidden">

<div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 18px">Book a role</h1><span style="font-size: 12px; color: #52525B">KUTM #820 · Thu 11/19 7:30pm</span></div>

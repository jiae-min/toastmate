<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>클럽 연결</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
h1,h2,h3{font-family:'Montserrat','Pretendard','Noto Sans KR',sans-serif;font-weight:700}
a{color:#004165}a:hover{color:#00334F}
</style>
</head>
<body>
<div style="width: 390px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif">
<main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 28px 20px 20px">
<div role="img" aria-label="온보딩 2 / 2단계" style="display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #004165"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #004165"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 24px">활동 중인 클럽을<br>연결해 주세요</h1><p style="margin: 0; font-size: 14px; color: #52525B">여러 클럽을 함께 연결할 수 있어요.</p></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">초대 코드<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px"><input type="text" placeholder="운영진에게 받은 코드 6자리" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"><button type="button" style="display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #004165; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; text-decoration: none">확인</button></div></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">클럽 검색<input type="search" placeholder="클럽 이름으로 검색" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #E6E9EB">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 15px; font-weight: 700; color: #004165">한국 토스트마스터즈</span><span style="font-size: 12px; color: #52525B">디스트릭트 93</span></div>
<div style="display:flex;align-items:center;gap:8px;padding-top:6px"><span style="font-size: 14px; font-weight: 700; color: #18181B">디비전 A</span><span style="flex:1;height:1px;background:#E6E9EB"></span></div>
<span style="font-size: 12px; font-weight: 700; color: #52525B; padding: 2px 4px 0">에어리어 13</span>
<button type="button" role="checkbox" aria-checked="true" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 8px 14px; border-radius: 16px; border: 0; background: #E5EDF2; font: inherit; color: #18181B; text-align: left"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">광화문 토스트마스터즈</span><span style="font-size: 12px; color: #52525B">한국어</span></span><span style="font-size: 13px; font-weight: 700; color: #004165">선택됨</span></button>
<button type="button" role="checkbox" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 8px 14px; border-radius: 16px; border: 0; background: #F2F3F5; font: inherit; color: #18181B; text-align: left"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">[클럽명]</span><span style="font-size: 12px; color: #52525B">[언어] · [모임 요일]</span></span><span style="font-size: 13px; font-weight: 700; color: #52525B">선택</span></button>
<span style="font-size: 12px; font-weight: 700; color: #52525B; padding: 2px 4px 0">에어리어 14</span>
<button type="button" role="checkbox" aria-checked="true" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 8px 14px; border-radius: 16px; border: 0; background: #E5EDF2; font: inherit; color: #18181B; text-align: left"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">KUTM</span><span style="font-size: 12px; color: #52525B">영어</span></span><span style="font-size: 13px; font-weight: 700; color: #004165">선택됨</span></button>
<button type="button" role="checkbox" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 8px 14px; border-radius: 16px; border: 0; background: #F2F3F5; font: inherit; color: #18181B; text-align: left"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">[클럽명]</span><span style="font-size: 12px; color: #52525B">[언어] · [모임 요일]</span></span><span style="font-size: 13px; font-weight: 700; color: #52525B">선택</span></button>
<div style="display:flex;align-items:center;gap:8px;padding-top:6px"><span style="font-size: 14px; font-weight: 700; color: #18181B">디비전 B</span><span style="flex:1;height:1px;background:#E6E9EB"></span></div>
<span style="font-size: 12px; font-weight: 700; color: #52525B; padding: 2px 4px 0">에어리어 [번호]</span>
<button type="button" role="checkbox" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 8px 14px; border-radius: 16px; border: 0; background: #F2F3F5; font: inherit; color: #18181B; text-align: left"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">[클럽명]</span><span style="font-size: 12px; color: #52525B">[언어] · [모임 요일]</span></span><span style="font-size: 13px; font-weight: 700; color: #52525B">선택</span></button>
<span style="font-size: 12px; color: #52525B">클럽 목록은 추후 반영 예정 · 검색으로 찾은 클럽은 운영진이 승인하면 연결돼요.</span>
</div>
</main>
<footer style="padding: 12px 20px 28px; border-top: 1px solid #E6E9EB"><a href="Main.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #004165; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; text-decoration: none; width: 100%; box-sizing: border-box; min-height: 52px; font-size: 16px">2개 클럽 연결하고 시작하기</a></footer>
</div>
</body>
</html>

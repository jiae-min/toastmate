<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>역할 시트 Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
h1,h2,h3{font-family:'Montserrat','Pretendard','Noto Sans KR',sans-serif;font-weight:700}
a{color:#004165}a:hover{color:#004165}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif">
<header style="display: flex; align-items: center; gap: 8px; padding: 20px 12px 14px; ">
<a href="Main.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #18181B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 18px">시간지기</h1>
<span style="font-size: 12px; color: #52525B">#820 · KUTM · 11/19</span>
</div>
</header>
<div role="tablist" aria-label="세션" style="display: flex; gap: 8px; padding: 8px 20px; overflow: hidden">
<button type="button" role="tab" aria-selected="true" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: #18181B; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">준비 연설</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: #F2F3F5; font: inherit; font-size: 14px; color: #18181B">주제 질문 세션</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: #F2F3F5; font: inherit; font-size: 14px; color: #18181B">평가</button>
</div>
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 13px; color: #52525B">발표자 1 · 아젠다에서 자동으로 불러옴</p>
<p style="margin: 0; font-size: 18px; font-weight: 700">Jiae · From President</p>
<p style="margin: 0; font-size: 14px; color: #52525B">기준 5–7분</p>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 20px; border-radius: 20px; background: #F2F3F5">
<p style="margin: 0; font-size: 64px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums">05:12</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-radius: 10px; background: #15803D; color: #FFFFFF"><span style="font-size: 12px">초록</span><span style="font-size: 15px; font-weight: 700">5:00</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-radius: 14px; background: #F2F3F5; border: 0"><span style="font-size: 12px; color: #52525B">노랑</span><span style="font-size: 15px; font-weight: 700">6:00</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-radius: 14px; background: #F2F3F5; border: 0"><span style="font-size: 12px; color: #52525B">빨강</span><span style="font-size: 15px; font-weight: 700">7:00</span></div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="min-height: 56px; border: 0; border-radius: 14px; background: #F2F3F5; font: inherit; font-size: 16px; font-weight: 700; color: #18181B">리셋</button>
<button type="button" style="min-height: 56px; border: 0; border-radius: 14px; background: #772432; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF">정지</button>
</div>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 14px; color: #52525B">오늘 기록</h2>
<div style="display: flex; justify-content: space-between; padding: 12px 14px; border: 0; border-radius: 12px; font-size: 14px; background: #F2F3F5"><span>Gloria · 진행자 오프닝</span><span style="font-weight: 700">2:10</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 14px; border: 0; border-radius: 12px; font-size: 14px; color: #52525B; background: #F2F3F5"><span>Jiae · 연설 1</span><span>측정 중</span></div>
</section>
</main>
<footer style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 24px; border-top: 1px solid #E6E9EB">
<p style="margin: 0; font-size: 12px; color: #52525B">이 시트를 쓰면 내 기록에 시간지기 1회가 자동으로 남아요.</p>
<button type="button" style="min-height: 48px; border: 0; border-radius: 12px; background: #004165; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF">시간지기 리포트 복사</button>
</footer>
</div>
</body>
</html>

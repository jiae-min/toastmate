<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 정보 입력</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
h1,h2,h3{font-family:'Montserrat','Pretendard','Noto Sans KR',sans-serif;font-weight:700}
a{color:#004165}a:hover{color:#00334F}
</style>
</head>
<body>
<div style="width: 390px; height: 1420px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif">
<main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 28px 20px 20px">
<div role="img" aria-label="온보딩 1 / 2단계" style="display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #004165"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #D5DADA"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 24px">내 정보를 입력해 주세요</h1><p style="margin: 0; font-size: 14px; color: #52525B">아젠다에 적힌 이름과 맞춰 역할 기록을 자동으로 쌓아요.</p></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">회원 번호<input type="text" inputmode="numeric" placeholder="예: 01234567" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">영어 이름<input type="text" placeholder="예: Jiae" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525B">본명 (원어로 입력)<input type="text" placeholder="예: 민지예" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; color: #18181B; background: #F2F3F5"></label>
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid #E6E9EB">
<span style="font-size: 15px; font-weight: 700; color: #004165">진행 중인 패스웨이</span>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #52525B">현재 경로 <span style="font-weight: 400"></span></span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Dynamic Leadership</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Engaging Humor</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Motivational Strategies</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Persuasive Influence</button><button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #E5EDF2; font: inherit; font-size: 13px; font-weight: 700; color: #004165; text-align: left">Presentation Mastery</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Visionary Communication</button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #52525B">레거시 경로 <span style="font-weight: 400">· 2024년 10월 이전 구매</span></span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Effective Coaching</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Innovative Planning</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Leadership Development</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Strategic Relationships</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Team Collaboration</button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #52525B">빈티지 경로 <span style="font-weight: 400">· 2026년 추가</span></span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">Basic Training for Toastmasters</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 6px 10px; border-radius: 14px; border: 0; background: #F2F3F5; font: inherit; font-size: 13px; color: #18181B; text-align: left">The Communication Series: Entertaining Speaker + Storytelling</button></div></div>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #F2F3F5; font: inherit; font-size: 13px; font-weight: 700; color: #18181B; border-style: dashed">+ 경로 하나 더 추가</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 700; color: #004165">현재 레벨</span><div role="radiogroup" aria-label="패스웨이 레벨" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: #F2F3F5"><button type="button" role="radio" aria-checked="false" style="min-height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 12px; color: #52525B">레벨 1</button><button type="button" role="radio" aria-checked="true" style="min-height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(24,24,27,0.08); font: inherit; font-size: 12px; font-weight: 700; color: #004165">레벨 2</button><button type="button" role="radio" aria-checked="false" style="min-height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 12px; color: #52525B">레벨 3</button><button type="button" role="radio" aria-checked="false" style="min-height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 12px; color: #52525B">레벨 4</button><button type="button" role="radio" aria-checked="false" style="min-height: 38px; padding: 0 6px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 12px; color: #52525B">레벨 5</button></div></div>
<p style="margin: 0; font-size: 12px; color: #52525B">레거시 경로는 2025년 10월 레벨별 필수 역할이 적용되지 않아, 기록 탭의 트래커가 '해당 없음'으로 표시돼요.</p>
</main>
<footer style="padding: 12px 20px 28px; border-top: 1px solid #E6E9EB"><a href="OnbClub.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #004165; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; text-decoration: none; width: 100%; box-sizing: border-box; min-height: 52px; font-size: 16px">다음</a></footer>
</div>
</body>
</html>
